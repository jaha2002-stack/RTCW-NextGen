name: Windows DX12 build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-dx12:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build engine, DXIL shaders and map compiler
        run: ./scripts/build-windows.ps1
      - name: Test synthetic geometry and package rules
        run: python -B scripts/test-project.py --rbdmap build-windows/tools/compilers/Release/rbdmap.exe
      - name: Build the authored P02 level for PC testing
        run: python -B scripts/compile-native-level.py tests/fixtures/cloud_room.map --rbdmap build-windows/tools/compilers/Release/rbdmap.exe --assets tests/fixtures/native-level --out build-windows/native-level --aas aas48
      - name: Compile Relay Station geometry, collision and navigation
        run: python -B scripts/compile-native-level.py tests/fixtures/relay_station.map --rbdmap build-windows/tools/compilers/Release/rbdmap.exe --assets tests/fixtures/native-level --out build-windows/relay-station --aas aas48 --map-name relay
      - name: Package Relay Station and verify clean extraction
        run: python scripts/package-windows.py --out build-windows/artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-station-windows-dx12-${{ github.sha }}
          path: build-windows/artifacts/
          if-no-files-found: error
